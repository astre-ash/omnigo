services:
  postgres:
    image: postgres:16-alpine
    container_name: metrics-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrations:
    image: juhokoskela/goose:latest
    container_name: metrics-env-migrations
    volumes:

      - ./internal/storage/postgres/migrations:/migrations

    command: [ "postgres", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up" ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

